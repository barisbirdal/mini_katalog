name: mini_katalog
description: "Flutter ile geliştirilmiş Mini Katalog Uygulaması (eğitim projesi)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Yönerge gereği yalnızca Flutter SDK (material.dart) kullanılır, ekstra paket yoktur.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
